version: 2
updates:
  # Actions use major tags; this opens a PR when a new major is out.
  # Dev dependencies are types and the compiler. A harness bump that moves a type
  # out of reach fails `pnpm typecheck` (see hooks/adapters/pi.ts).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all minor and patch bumps; majors still open their own PR.
      minor-and-patch:
        update-types: ["minor", "patch"]
  # What a pinned via installs on people's machines: a bump here is the reviewed update.
  - package-ecosystem: npm
    directory: /relay/codex-acp
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
